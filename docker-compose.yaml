name: lipass

services:
  # 编排内 PostgreSQL：仅在 bundle profile 下启动（默认 `--profile bundle`）。
  # 远程数据库模式：不启用该 profile，并在 .env 中配置 DATABASE_URL 指向远程实例。
  postgres:
    image: ${IMAGE_REGISTRY:-}postgres:16-alpine
    profiles: ["bundle"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    # 数据库不发布到宿主机，仅容器内网可达；需要本机调试时再取消注释：
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    stop_grace_period: 30s
    # 资源上限按部署规模调整（Compose 非 swarm 模式使用 mem_limit/cpus）
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 编排内 Redis：同样只在 bundle profile 下启动；远程模式配置 REDIS_URL 即可。
  redis:
    image: ${IMAGE_REGISTRY:-}redis:7-alpine
    profiles: ["bundle"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # AOF 默认开启（数据落盘更稳，最多丢 1 秒数据）；演示/测试可设 REDIS_APPENDONLY=no
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-portal-dev-redis}
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      # 限制内存并只淘汰带 TTL 的键（本项目 Redis 键全部带 TTL），
      # 避免容器 OOM；限流/2FA/待授权数据被淘汰后只会要求用户重试。
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - volatile-ttl
    # Redis 不发布到宿主机；生产务必设置强 REDIS_PASSWORD，开发用默认口令仅限本机。
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-prod:/data
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-portal-dev-redis}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ${IMAGE_REGISTRY:-}lipass-backend:local
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn/debian}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 未显式设置 DATABASE_URL/REDIS_URL 时默认使用编排内服务；设置后即切换到远程实例
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@postgres:5432/${POSTGRES_DB:-portal}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-portal-dev-redis}@redis:6379/0}
      CORS_ORIGINS: "${CORS_ORIGINS:-[\"http://localhost\"]}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-[\"localhost\",\"127.0.0.1\",\"backend\"]}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lipass_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_DEFAULT_TTL_DAYS: ${SESSION_DEFAULT_TTL_DAYS:-1}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-720}
      # 登录可信设备：勾选「信任此设备」后该设备 7 天内登录免二次验证（仅登录环节）
      TRUSTED_DEVICE_TTL_DAYS: ${TRUSTED_DEVICE_TTL_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      PENDING_REQUEST_STORE: ${PENDING_REQUEST_STORE:-redis}
      TWOFA_STORE: ${TWOFA_STORE:-redis}
      RATE_LIMITER: ${RATE_LIMITER:-redis}
      ADMIN_INVITE_RATE_LIMIT: ${ADMIN_INVITE_RATE_LIMIT:-100}
      ADMIN_INVITE_RATE_WINDOW_SECONDS: ${ADMIN_INVITE_RATE_WINDOW_SECONDS:-3600}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-true}
      # 只信任编排内网关的固定 IP（见下方 gateway.networks），
      # 防止同网段内其他容器伪造 X-Forwarded-For 绕过限流/污染审计 IP；
      # 自定义网络/外部反代时按实际网关地址覆盖。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.10}
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      JWT_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/keys/jwt_private.pem}
      # 密钥轮换（可选）：目录内每个 *.pem 的文件名即 kid；两个变量同时使用
      JWT_KEYS_DIR: ${JWT_KEYS_DIR:-}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-}
      ENCRYPTION_KEY_PATH: ${ENCRYPTION_KEY_PATH:-/app/keys/encryption.key}
      DEMO_HOME_URL: ${DEMO_HOME_URL:-http://localhost/demo/}
      DEMO_LOGOUT_URI: ${DEMO_LOGOUT_URI:-http://localhost/demo/logout}
      DEMO_REDIRECT_URI: ${DEMO_REDIRECT_URI:-http://localhost/demo/callback}
      DEMO_BACKCHANNEL_LOGOUT_URI: ${DEMO_BACKCHANNEL_LOGOUT_URI:-http://demo-site:3001/backchannel-logout}
      LOGOUT_TOKEN_TTL_SECONDS: ${LOGOUT_TOKEN_TTL_SECONDS:-120}
      BACKCHANNEL_LOGOUT_TIMEOUT_SECONDS: ${BACKCHANNEL_LOGOUT_TIMEOUT_SECONDS:-5}
      BACKCHANNEL_LOGOUT_MAX_RETRIES: ${BACKCHANNEL_LOGOUT_MAX_RETRIES:-2}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Li&Pass}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      SMTP_MAX_RETRIES: ${SMTP_MAX_RETRIES:-2}
      SMTP_RETRY_DELAY_SECONDS: ${SMTP_RETRY_DELAY_SECONDS:-1}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      LOGIN_EMAIL_RATE_LIMIT: ${LOGIN_EMAIL_RATE_LIMIT:-20}
      LOGIN_EMAIL_RATE_WINDOW_SECONDS: ${LOGIN_EMAIL_RATE_WINDOW_SECONDS:-900}
      AUTHORIZE_RATE_LIMIT: ${AUTHORIZE_RATE_LIMIT:-120}
      AUTHORIZE_RATE_WINDOW_SECONDS: ${AUTHORIZE_RATE_WINDOW_SECONDS:-60}
      TOKEN_RATE_LIMIT: ${TOKEN_RATE_LIMIT:-120}
      TOKEN_RATE_WINDOW_SECONDS: ${TOKEN_RATE_WINDOW_SECONDS:-60}
      CLIENT_BLOCK_RATE_LIMIT: ${CLIENT_BLOCK_RATE_LIMIT:-100}
      CLIENT_BLOCK_RATE_WINDOW_SECONDS: ${CLIENT_BLOCK_RATE_WINDOW_SECONDS:-3600}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      AVATAR_CLEANUP_INTERVAL_SECONDS: ${AVATAR_CLEANUP_INTERVAL_SECONDS:-21600}
      EPHEMERAL_RETENTION_HOURS: ${EPHEMERAL_RETENTION_HOURS:-168}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      IP2REGION_DATA_DIR: ${IP2REGION_DATA_DIR:-/app/data/ip2region}
      IP2REGION_AUTO_UPDATE_ENABLED: ${IP2REGION_AUTO_UPDATE_ENABLED:-false}
      IP2REGION_UPDATE_INTERVAL_HOURS: ${IP2REGION_UPDATE_INTERVAL_HOURS:-24}
      IP2REGION_RELEASES_API_URL: ${IP2REGION_RELEASES_API_URL:-https://api.github.com/repos/lionsoul2014/ip2region/releases/latest}
      IP2REGION_DOWNLOAD_BASE_URL: ${IP2REGION_DOWNLOAD_BASE_URL:-https://raw.githubusercontent.com/lionsoul2014/ip2region}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    # 不向宿主机开放端口：只允许通过 gateway（nginx）访问，
    # 容器内网（172.30.0.0/24）仍可通过 backend:8000 互通。
    volumes:
      - backend-keys:/app/keys
      - backend-uploads:/app/uploads
      # 运行期更新的 ip2region 数据落盘：容器重建后保留，避免反复重下。
      # 首次挂载时 Docker 会把镜像内置数据复制进空卷（v3.17.0）。
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    mem_limit: 768m
    cpus: "1.0"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: ${IMAGE_REGISTRY:-}lipass-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONNECT_SRC: ${VITE_API_BASE_URL-}
    # 不向宿主机开放端口：静态资源只通过 gateway（nginx）对外提供。
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # 单域名网关：http://<域名>/ → 前端，/api、/oauth2 等 → 后端，/demo → 演示站
  gateway:
    image: ${IMAGE_REGISTRY:-}nginx:1.27-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # 固定容器 IP：后端 FORWARDED_ALLOW_IPS 只信任这一台网关。
    # 避开编排内其他动态分配的 .2/.3 等地址，固定使用高位地址。
    networks:
      default:
        ipv4_address: 172.30.0.10
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # 示例授权网站仅用于本地演示：`docker compose --profile demo up -d --build`
  # 默认 `docker compose up -d` 不会启动它，避免示例应用混入生产栈。
  demo-site:
    profiles: ["demo"]
    image: ${IMAGE_REGISTRY:-}lipass-demo-site:local
    build:
      context: ./examples/demo-site
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn/debian}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost}
      PORTAL_API_BASE: http://backend:8000
      PORTAL_CLIENT_ID: ${DEMO_CLIENT_ID:-demo-site}
      DEMO_REDIRECT_URI: ${DEMO_REDIRECT_URI:-http://localhost/demo/callback}
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:-}
      DEMO_PATH_PREFIX: /demo
      DEMO_HOME_URL: ${DEMO_HOME_URL:-http://localhost/demo/}
    # 演示站同样不向宿主机开放端口，统一走 gateway 的 /demo/ 路径。
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3001/').status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data-prod:
  redis-data-prod:
  backend-keys:
  backend-uploads:
  backend-data:

networks:
  default:
    name: lipass-net
    ipam:
      config:
        # 固定子网：网关固定在 172.30.0.10，后端只信任该 IP 追加的 X-Forwarded-For。
        - subnet: 172.30.0.0/24
