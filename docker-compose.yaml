name: portal-oss

services:
  postgres:
    image: ${IMAGE_REGISTRY:-}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    # 数据库不发布到宿主机，仅容器内网可达；需要本机调试时再取消注释：
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    stop_grace_period: 30s
    # 资源上限按部署规模调整（Compose 非 swarm 模式使用 mem_limit/cpus）
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: ${IMAGE_REGISTRY:-}redis:7-alpine
    restart: unless-stopped
    # AOF 默认开启（数据落盘更稳，最多丢 1 秒数据）；演示/测试可设 REDIS_APPENDONLY=no
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-portal-dev-redis}
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
    # Redis 不发布到宿主机；生产务必设置强 REDIS_PASSWORD，开发用默认口令仅限本机。
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-prod:/data
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-portal-dev-redis}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ${IMAGE_REGISTRY:-}portal-oss-backend:local
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD:-portal-dev-redis}@redis:6379/0
      CORS_ORIGINS: "${CORS_ORIGINS:-[\"http://localhost:5173\"]}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-[\"localhost\"]}"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      PENDING_REQUEST_STORE: ${PENDING_REQUEST_STORE:-redis}
      TWOFA_STORE: ${TWOFA_STORE:-redis}
      RATE_LIMITER: ${RATE_LIMITER:-redis}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8000}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/keys/jwt_private.pem}
      ENCRYPTION_KEY_PATH: ${ENCRYPTION_KEY_PATH:-/app/keys/encryption.key}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Portal OSS}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    volumes:
      - backend-keys:/app/keys
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: "1.0"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: ${IMAGE_REGISTRY:-}portal-oss-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONNECT_SRC: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # 示例授权网站仅用于本地演示：`docker compose --profile demo up -d --build`
  # 默认 `docker compose up -d` 不会启动它，避免示例应用混入生产栈。
  demo-site:
    profiles: ["demo"]
    image: ${IMAGE_REGISTRY:-}portal-oss-demo-site:local
    build:
      context: ./examples/demo-site
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      PORTAL_ISSUER: ${JWT_ISSUER:-http://localhost:8000}
      PORTAL_API_BASE: http://backend:8000
      PORTAL_CLIENT_ID: ${DEMO_CLIENT_ID:-demo-site}
      DEMO_REDIRECT_URI: ${DEMO_REDIRECT_URI:-http://localhost:3001/callback}
      DEMO_SECRET_KEY: ${DEMO_SECRET_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3001/').status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data-prod:
  redis-data-prod:
  backend-keys:
  backend-uploads:
