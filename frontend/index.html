<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1220"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="LinPass SSO —— 统一登录门户，一次注册，通行所有授权网站。"
    />
    <title>LinPass SSO · 统一登录门户</title>
    <script>
      // 在首帧渲染前应用主题，避免明暗闪烁
      (function () {
        try {
          var stored = localStorage.getItem("portal-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      /* 兜底背景：CSS bundle 未就绪时避免刷新瞬间白屏 */
      html,
      body,
      #root {
        background-color: #f8fafc;
        min-height: 100%;
      }
      html.dark,
      html.dark body,
      html.dark #root {
        background-color: #0b1220;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
