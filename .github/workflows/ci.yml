name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行后端全量测试
        run: python -m pytest -q

  frontend:
    name: 前端校验（tsc / lint / vitest / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 准备本地品牌配置
        run: cp src/lib/brand.example.ts src/lib/brand.ts

      - name: 类型检查
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: 单元/组件测试
        run: npm test

      - name: 生产构建
        run: npm run build
