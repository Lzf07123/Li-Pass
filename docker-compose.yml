services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal@postgres:5432/portal
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      PENDING_REQUEST_STORE: redis
      FRONTEND_BASE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  demo-site:
    build: ./examples/demo-site
    environment:
      PORTAL_ISSUER: http://localhost:8000
      PORTAL_API_BASE: http://backend:8000
      PORTAL_CLIENT_ID: demo-site
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
